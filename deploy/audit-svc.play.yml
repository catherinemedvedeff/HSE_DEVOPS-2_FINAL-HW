
---
- name: Deploy audit-svc infrastructure
  hosts: prom
  gather_facts: false

  tasks:
    - name: Create Docker network
      community.docker.docker_network:
        name: "{{ docker_network }}"

    - name: Create PostgreSQL volume
      community.docker.docker_volume:
        name: "{{ postgres_volume }}"

    - name: Start PostgreSQL 17
      community.docker.docker_container:
        name: "{{ postgres_container }}"
        image: "{{ postgres_image }}"
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ docker_network }}"
        ports: []
        volumes:
          - "{{ postgres_volume }}:/var/lib/postgresql/data"
        env:
          POSTGRES_PASSWORD: "{{ vault_postgres_password }}"
        comparisons:
          env: ignore
      no_log: true

    - name: Get PostgreSQL container information
      community.docker.docker_container_info:
        name: "{{ postgres_container }}"
      register: postgres_info

    - name: Get PostgreSQL internal IP
      ansible.builtin.set_fact:
        postgres_ip: >-
          {{ postgres_info.container.NetworkSettings.Networks[docker_network].IPAddress }}

    - name: Wait for PostgreSQL
      ansible.builtin.wait_for:
        host: "{{ postgres_ip }}"
        port: "{{ postgres_port }}"
        timeout: 60

    - name: Create audit_svc PostgreSQL user
      community.postgresql.postgresql_user:
        name: "{{ postgres_user }}"
        password: "{{ vault_audit_password }}"
        login_host: "{{ postgres_ip }}"
        login_user: postgres
        login_password: "{{ vault_postgres_password }}"
        state: present
      no_log: true

    - name: Create audit database
      community.postgresql.postgresql_db:
        name: "{{ postgres_database }}"
        owner: "{{ postgres_user }}"
        login_host: "{{ postgres_ip }}"
        login_user: postgres
        login_password: "{{ vault_postgres_password }}"
        state: present
      no_log: true

    - name: Create audit-svc config directory
      ansible.builtin.file:
        path: "{{ audit_svc_config_dir }}"
        state: directory
        owner: "{{ audit_svc_uid }}"
        group: "{{ audit_svc_gid }}"
        mode: "0750"

    - name: Render audit-svc configuration
      ansible.builtin.template:
        src: audit-config.yaml.j2
        dest: "{{ audit_svc_config_dir }}/config.yaml"
        owner: "{{ audit_svc_uid }}"
        group: "{{ audit_svc_gid }}"
        mode: "{{ audit_svc_config_mode }}"
      notify: Reload audit-svc configuration
      no_log: true

    - name: Start audit-svc container
      community.docker.docker_container:
        name: "{{ audit_svc_container }}"
        image: "{{ audit_svc_image }}"
        state: started
        pull: missing
        restart_policy: unless-stopped
        networks:
          - name: "{{ docker_network }}"
        volumes:
          - "{{ audit_svc_config_dir }}:/etc/audit-svc:ro"
        env:
          AUDIT_SVC_CONFIG: /etc/audit-svc/config.yaml
        ports: []

    - name: Apply pending configuration reload
      ansible.builtin.meta: flush_handlers

    - name: Create Nginx config directory
      ansible.builtin.file:
        path: "{{ nginx_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Render Nginx configuration
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: "{{ nginx_config_dir }}/nginx.conf"
        owner: root
        group: root
        mode: "0644"
      register: nginx_config

    - name: Start Nginx container
      community.docker.docker_container:
        name: "{{ nginx_container }}"
        image: "{{ nginx_image }}"
        state: started
        restart_policy: unless-stopped
        recreate: "{{ nginx_config.changed }}"
        networks:
          - name: "{{ docker_network }}"
        published_ports:
          - "{{ nginx_host_port }}:8080"
        volumes:
          - "{{ nginx_config_dir }}/nginx.conf:/etc/nginx/conf.d/default.conf:ro"

    - name: Start Nginx exporter
      community.docker.docker_container:
        name: "{{ nginx_exporter_container }}"
        image: "{{ nginx_exporter_image }}"
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ docker_network }}"
        published_ports:
          - "{{ nginx_exporter_port }}:9113"
        command:
          - "--nginx.scrape-uri=http://{{ nginx_container }}:8081/stub_status"

  handlers:
    - name: Reload audit-svc configuration
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ docker_network }}"
          - curlimages/curl:latest
          - --fail-with-body
          - --silent
          - --show-error
          - --request
          - POST
          - "http://{{ audit_svc_container }}:8080/reload"
      register: reload_result
      changed_when: true
      failed_when: >-
        reload_result.rc != 0 or
        (reload_result.stdout | from_json).status != 'reloaded'
      no_log: true
