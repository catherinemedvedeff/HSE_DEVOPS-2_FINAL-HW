
name: audit-svc Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: python -m pip install poetry==2.5.1

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Run tests
        run: poetry run pytest --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-junit-report
          path: test-results.xml
          if-no-files-found: warn

  build:
    name: Build and push release image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}

  deploy:
    name: Deploy production
    needs: build
    runs-on: [self-hosted, deploy]
    environment: production

    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Deploy with Ansible
        shell: bash
        working-directory: deploy
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          AUDIT_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail

          VAULT_FILE=$(mktemp)
          trap 'rm -f "$VAULT_FILE"' EXIT

          chmod 600 "$VAULT_FILE"
          printf '%s' "$VAULT_PASSWORD" > "$VAULT_FILE"

          sudo -n ANSIBLE_CONFIG="$PWD/ansible.cfg" \
            /usr/bin/ansible-playbook audit-svc.play.yml \
            --vault-password-file "$VAULT_FILE" \
            --extra-vars "audit_svc_image=$AUDIT_IMAGE"
